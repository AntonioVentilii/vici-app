name: Install Juno CLI
description: Install the pinned Juno CLI globally — the single source of truth for the @junobuild/cli version used by every workflow that builds the satellite functions or mutates the satellite.

# Why the pinned CLI instead of `junobuild/juno-action@full`: the action's image
# bundles a stale `@icp-sdk/bindgen` that drops the `defineQuery` / `defineUpdate`
# exports, emitting `satellite_extension.did` as `service : {}` — a satellite with
# NO custom endpoints (the "method" errors that only surfaced via CI). The npm CLI
# builds against our own `node_modules` and reproduces the local build.
# Upstream: https://github.com/junobuild/juno-action/issues/108
#
# This is the ONE place the pin lives. Bump it in lockstep with the dependabot
# `juno-kit` `@junobuild/functions` bumps so the CLI and JS package stay aligned.

runs:
  using: composite
  steps:
    - name: Install Juno CLI
      shell: bash
      run: npm i -g @junobuild/cli@0.15.4
