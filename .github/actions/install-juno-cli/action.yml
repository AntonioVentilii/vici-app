name: Install Juno build toolchain
description: Install the pinned Juno CLI plus the external tools `juno functions build` needs to assemble the satellite wasm — ic-wasm and @icp-sdk/bindgen. Single source of truth for these pinned versions.

# `juno functions build` (TS / Sputnik) runs three stages: esbuild bundle ->
# generate the API/candid (`@icp-sdk/bindgen`) -> assemble the satellite wasm
# (`ic-wasm`, which embeds the compiled functions into the satellite). If
# ic-wasm or bindgen are missing the CLI prompts to install them, and under
# `--headless` it auto-declines and SILENTLY skips the wasm-assembly stage while
# still exiting 0 — so a downstream `juno functions upgrade` ships a satellite
# with NONE of its custom endpoints (runtime "Canister has no query method ...",
# IC0536). The junobuild/juno-action image bakes these tools; when we drive the
# CLI directly we must install them ourselves so CI matches the local dev
# toolchain. This is the ONE place these versions live — bump them together with
# the dependabot juno-kit `@junobuild/functions` bumps.

runs:
  using: composite
  steps:
    - name: Install Juno CLI and bindgen
      shell: bash
      run: npm i -g @junobuild/cli@0.15.4 @icp-sdk/bindgen@0.4.0

    - name: Install ic-wasm
      shell: bash
      run: |
        version=0.9.11
        url="https://github.com/dfinity/ic-wasm/releases/download/${version}/ic-wasm-x86_64-unknown-linux-gnu.tar.xz"
        curl --fail --location --silent --show-error "$url" -o /tmp/ic-wasm.tar.xz
        mkdir -p /tmp/ic-wasm
        tar -xJf /tmp/ic-wasm.tar.xz -C /tmp/ic-wasm
        sudo install -m 0755 "$(find /tmp/ic-wasm -type f -name ic-wasm | head -1)" /usr/local/bin/ic-wasm
        ic-wasm --version
