name: Apply Juno Config

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

# Per-workflow queue: serialize Config-apply runs only with each other — never
# cancel a running config apply, queue the next. Its own group, independent of
# upgrade / deploy / publish.
concurrency:
  group: juno-satellite-config
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify JUNO_TOKEN is set
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
        run: |
          if [ -z "$JUNO_TOKEN" ]; then
            echo "::error::JUNO_TOKEN secret is not set. Generate an Administrator access key in the Juno Console and add it as the JUNO_TOKEN repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      # Applies juno.config.ts (collection rules + authentication config) to
      # the production satellite. Reads the config only — no wasm build needed,
      # unlike publish/upgrade. Rewriting security rules + auth config is an
      # administrative operation, so it uses the Administrator JUNO_TOKEN (like
      # upgrade.yml), not OIDC. Production is the CLI's default mode.
      - name: Apply config
        uses: junobuild/juno-action@full
        with:
          args: config apply
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
