name: Deploy to Juno

on:
  workflow_dispatch:
  push:
    tags:
      - v*

# Shared `juno-satellite` group with publish.yml: both mutate the same
# satellite canister and must not overlap (`functions upgrade` stops it
# mid-run, so a concurrent mutation is rejected with "Canister is stopped").
# A `v*` tag fires both workflows, so the shared group serializes them.
# cancel-in-progress: false → queue, never cancel a running one.
concurrency:
  group: juno-satellite
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify JUNO_TOKEN is set
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
        run: |
          if [ -z "$JUNO_TOKEN" ]; then
            echo "::error::JUNO_TOKEN secret is not set. Generate an Administrator access key in the Juno Console and add it as the JUNO_TOKEN repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Build functions
        uses: junobuild/juno-action@full
        with:
          args: functions build

      - name: Upgrade functions
        uses: junobuild/juno-action@full
        with:
          args: functions upgrade
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}

      # `--prune` deletes superseded content-hashed assets. Without it `#dapp`
      # grows every deploy until asset certification exceeds the IC's
      # 40B-instruction message limit and the site 503s ("Invalid tree root hash").
      - name: Deploy to Juno
        uses: junobuild/juno-action@main
        with:
          args: hosting deploy --prune
