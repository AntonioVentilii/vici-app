name: Deploy to Juno

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

# Shared across deploy / publish / upgrade: all three mutate the same
# satellite canister, and `functions upgrade` stops it mid-upgrade — a
# concurrent `hosting deploy` would be rejected with "Canister is stopped".
# One queue serializes every satellite mutation.
concurrency:
  group: juno-satellite
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Deploy to Juno
        uses: junobuild/juno-action@main
        with:
          args: hosting deploy
