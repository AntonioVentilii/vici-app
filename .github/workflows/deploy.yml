name: Deploy to Juno

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (satellite) to deploy to.'
        type: choice
        options:
          - staging
          - production
        default: staging
  push:
    branches:
      - main
    tags:
      - v*

# Environment routing:
#   - push to `main`  → staging   satellite (mode=staging, JUNO_TOKEN_STAGING)
#   - push `v*` tag   → production satellite (mode=production, JUNO_TOKEN)
#   - manual dispatch → the chosen `environment` input
#
# The concurrency group is suffixed with the resolved mode so staging and
# production target different satellites and never block each other. The group
# is also workflow-specific (`-deploy`) so deploy and publish each keep their
# own queue — a rapid second `main` push only ever queues one pending deploy
# (no third-member silent-cancel). `cancel-in-progress: false` queues runs so a
# `functions upgrade` (which stops the canister mid-run) never overlaps another
# mutation of the same canister ("Canister is stopped", IC0508).
concurrency:
  group: juno-satellite-deploy-${{ github.ref_type == 'tag' && 'production' || (github.event_name == 'workflow_dispatch' && inputs.environment || 'staging') }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.environment }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            MODE="production"
          else
            MODE="staging"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy mode: $MODE"

      - name: Verify the deploy token is set
        env:
          JUNO_TOKEN: ${{ (steps.target.outputs.mode == 'production' && secrets.JUNO_TOKEN) || (steps.target.outputs.mode != 'production' && secrets.JUNO_TOKEN_STAGING) || '' }}
        run: |
          if [ -z "$JUNO_TOKEN" ]; then
            echo "::error::No Administrator access key is set for the '${{ steps.target.outputs.mode }}' environment. Generate one in the Juno Console for the target satellite and add it as the JUNO_TOKEN (production) or JUNO_TOKEN_STAGING (staging) repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Build functions
        uses: junobuild/juno-action@full
        with:
          args: functions build

      - name: Upgrade functions
        uses: junobuild/juno-action@full
        with:
          args: functions upgrade --mode ${{ steps.target.outputs.mode }}
        env:
          JUNO_TOKEN: ${{ (steps.target.outputs.mode == 'production' && secrets.JUNO_TOKEN) || (steps.target.outputs.mode != 'production' && secrets.JUNO_TOKEN_STAGING) || '' }}

      # `--prune` deletes superseded content-hashed assets. Without it `#dapp`
      # grows every deploy until asset certification exceeds the IC's
      # 40B-instruction message limit and the site 503s ("Invalid tree root hash").
      #
      # `JUNO_MODE` is read by the `npm run build` predeploy (`vite build --mode
      # ${JUNO_MODE:-production}`): `@junobuild/vite-plugin` resolves the
      # satellite id baked into the bundle (`VITE_SATELLITE_ID`) from the Vite
      # build mode, so without it a `main`-push deploy would ship a
      # production-pointing bundle onto the staging canister.
      - name: Deploy to Juno
        uses: junobuild/juno-action@main
        with:
          args: hosting deploy --prune --mode ${{ steps.target.outputs.mode }}
        env:
          JUNO_MODE: ${{ steps.target.outputs.mode }}
