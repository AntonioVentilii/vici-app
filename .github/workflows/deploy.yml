name: Deploy to Juno

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v*

# Per-workflow queue: serialize Deploy runs only with each other — never cancel
# a running deploy, queue the next. Its own group, so a deploy is never
# cancelled by (nor cancels) an upgrade / publish / config run.
concurrency:
  group: juno-satellite-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Deploy to Juno
        uses: junobuild/juno-action@main
        with:
          args: hosting deploy
