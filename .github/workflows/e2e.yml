name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check if commits can be added
        id: check_can_add_commit
        run: |
          echo "can_add_commit=$CAN_ADD_COMMIT" >> $GITHUB_OUTPUT
        env:
          CAN_ADD_COMMIT: ${{ steps.app-token.outputs.token != '' && github.event_name == 'pull_request' }}

      - name: Checkout for pull request
        if: steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout
        if: steps.check_can_add_commit.outputs.can_add_commit == 'false'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Install Juno CLI
        run: npm i -g @junobuild/cli

      - name: Run emulator
        run: |
          set -e
          juno emulator start --headless &
          juno emulator wait
          juno login --emulator --mode development --headless
          juno config apply --mode development --headless

      - name: Run tests
        run: npm run e2e:ci

      - name: Upload Playwright Report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3

      - name: Upload Playwright Results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 3

      - name: Check for Changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain e2e)" ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updates
        if: steps.check_snapshots.outputs.CHANGES == 'true' && steps.check_can_add_commit.outputs.can_add_commit == 'true'
        uses: ./.github/actions/add-and-commit
        with:
          add: e2e
          message: '🤖 Update E2E snapshots'
          token: ${{ steps.app-token.outputs.token }}

      - name: Stage Changes on main
        if: steps.check_snapshots.outputs.CHANGES == 'true' && steps.check_can_add_commit.outputs.can_add_commit == 'false'
        run: git add e2e

      - name: Check the Changed Files
        if: steps.check_snapshots.outputs.CHANGES == 'true' && steps.check_can_add_commit.outputs.can_add_commit == 'false'
        run: |
          MODIFIED_FILES=$(git diff --cached --name-only)
          echo "MODIFIED_FILES<<EOF" >> $GITHUB_ENV
          echo "$MODIFIED_FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Pull Request (if changes and on main)
        if: steps.check_snapshots.outputs.CHANGES == 'true' && steps.check_can_add_commit.outputs.can_add_commit == 'false'
        uses: ./.github/actions/create-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bot-e2e-update-snapshots
          paths: e2e/
          title: 'chore(e2e): Update Playwright E2E Snapshots'
          body: |
            The following E2E snapshots have been updated:
            ```
            ${{ env.MODIFIED_FILES }}
            ```

  e2e-tests-pass:
    if: always()
    needs: ['e2e']
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/needs_success
        with:
          needs: '${{ toJson(needs) }}'
