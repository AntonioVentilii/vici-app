name: Publish Serverless Functions

on:
  workflow_dispatch:
  push:
    tags:
      - v*

# Shared group with deploy.yml / upgrade.yml — serializes all mutations of
# the satellite canister so an upgrade (which stops it) never overlaps a deploy.
concurrency:
  group: juno-satellite
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Install Juno CLI
        uses: ./.github/actions/install-juno-cli

      - name: Build functions
        run: npm run juno:functions:build

      # publish keeps junobuild/juno-action only for its OIDC token exchange
      # (id-token: write); `functions publish` uploads the wasm built above
      # without rebuilding, so it inherits the CLI-built artifact.
      - name: Publish
        uses: junobuild/juno-action@full
        with:
          args: functions publish
