name: Publish Serverless Functions

on:
  workflow_dispatch:
  push:
    tags:
      - v*

# Per-workflow queue: serialize Publish runs only with each other — never cancel
# a running publish, queue the next. Its own group, independent of
# upgrade / deploy / config.
concurrency:
  group: juno-satellite-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Build
        uses: junobuild/juno-action@full
        with:
          args: functions build

      - name: Publish
        uses: junobuild/juno-action@full
        with:
          args: functions publish
