name: Publish Serverless Functions

on:
  workflow_dispatch:
  push:
    tags:
      - v*

# Shared group with deploy.yml / upgrade.yml — serializes all mutations of
# the satellite canister so an upgrade (which stops it) never overlaps a deploy.
concurrency:
  group: juno-satellite
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare
        uses: ./.github/actions/prepare

      # Build with the pinned Juno CLI, NOT the action (see `upgrade.yml` and the
      # `satellite-schema` job in `checks.yml` for the rationale: the action's image
      # rewrites `satellite_extension.did` as `service : {}`, dropping every custom
      # endpoint). The publish step keeps the action because it relies on the action's
      # OIDC token exchange (id-token: write); `functions publish` only uploads the
      # already-built local WASM, it does not rebuild, so it inherits the CLI-built
      # artifact from the step above.
      - name: Install Juno CLI
        run: npm i -g @junobuild/cli@0.15.4

      - name: Build functions
        run: npm run juno:functions:build

      - name: Publish
        uses: junobuild/juno-action@full
        with:
          args: functions publish
