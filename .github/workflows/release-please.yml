name: Release Please

# Automates versioning + changelog from Conventional Commits.
#
# On every push to `main`, release-please maintains a standing "release PR"
# that bumps the version and regenerates CHANGELOG.md from the commits since
# the last release. Merging that PR cuts a `vX.Y.Z` tag + GitHub Release —
# which is exactly the event `deploy.yml` and `publish.yml` already trigger
# on (`push: tags: v*`). So merging the release PR is the deliberate ship.
#
# It bumps BOTH `package.json#version` and `package.json#juno.functions.version`
# in lockstep (see release-please-config.json `extra-files`).
#
# TOKEN: for the cut tag to trigger deploy.yml/publish.yml, release-please
# must create it with a token OTHER than the default GITHUB_TOKEN — tags
# (and PRs) created with GITHUB_TOKEN do not trigger further workflow runs.
# Add a fine-grained PAT with `contents: write` + `pull-requests: write` as
# the `RELEASE_PLEASE_PAT` repo secret. Without it this still works (the
# fallback below uses GITHUB_TOKEN), but you must then run deploy.yml /
# publish.yml via manual dispatch after the release tag lands.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      # When updating this action, also bump the $schema version in
      # release-please-config.json to match the bundled release-please version
      # (check the action's release notes).
      - uses: googleapis/release-please-action@66fbfe9439cb7a3660ecdc00d42573ef0bd00764 # v4.4.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_PAT || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Pinned to main, not github.ref_name: workflow_dispatch can run from
          # any branch, and a dynamic target would let a dispatch on a non-main
          # branch cut a v* tag there — which deploy.yml/publish.yml trigger on
          # (push: tags: v*). Releases only ever come off main.
          target-branch: main
