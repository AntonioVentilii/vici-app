name: Upgrade Serverless Functions

on:
  workflow_dispatch:
  push:
    tags:
      - v*

# Shared group with deploy.yml / publish.yml — serializes all mutations of
# the satellite canister so an upgrade (which stops it) never overlaps a deploy.
concurrency:
  group: juno-satellite
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify JUNO_TOKEN is set
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
        run: |
          if [ -z "$JUNO_TOKEN" ]; then
            echo "::error::JUNO_TOKEN secret is not set. Generate an Administrator access key in the Juno Console and add it as the JUNO_TOKEN repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Install Juno CLI
        uses: ./.github/actions/install-juno-cli

      - name: Build functions
        run: npm run juno:functions:build

      - name: Upgrade functions
        run: juno functions upgrade --headless
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
