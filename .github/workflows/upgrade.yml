name: Upgrade Serverless Functions

on:
  workflow_dispatch:
  # Auto-upgrade on every push to `main` is DISABLED on purpose. CI-deployed
  # functions ship a satellite that is missing its custom query methods —
  # production sign-in fails with IC0536 "Canister has no query method
  # 'app_get_profile'" — whereas upgrading from a local machine works. Until
  # the CI upgrade is fixed, upgrade manually via `workflow_dispatch` or
  # locally (`juno functions upgrade`). Do NOT re-add the `main` push trigger
  # before the root cause is resolved.
  push:
    tags:
      - v*

# Shared group with deploy.yml / publish.yml — serializes all mutations of
# the satellite canister so an upgrade (which stops it) never overlaps a deploy.
concurrency:
  group: juno-satellite
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify JUNO_TOKEN is set
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
        run: |
          if [ -z "$JUNO_TOKEN" ]; then
            echo "::error::JUNO_TOKEN secret is not set. Generate an Administrator access key in the Juno Console and add it as the JUNO_TOKEN repo secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare
        uses: ./.github/actions/prepare

      # Build + upgrade with the pinned Juno CLI, NOT `junobuild/juno-action@full`.
      # The action's image bundles its own toolchain and fails to enumerate the
      # `defineQuery` / `defineUpdate` exports from `src/satellite/index.ts` — it
      # rewrites `satellite_extension.did` as `service : {}`, so the satellite it
      # builds is missing every custom endpoint (the "method" errors that only show
      # up via CI). The npm-installed CLI runs against our own `node_modules` and
      # reproduces the local build byte-for-byte. Same rationale + pin as the
      # `satellite-schema` job in `checks.yml` and `e2e.yml`; bump deliberately.
      - name: Install Juno CLI
        run: npm i -g @junobuild/cli@0.15.4

      - name: Build functions
        run: npm run juno:functions:build

      - name: Upgrade functions
        run: juno functions upgrade --headless
        env:
          JUNO_TOKEN: ${{ secrets.JUNO_TOKEN }}
