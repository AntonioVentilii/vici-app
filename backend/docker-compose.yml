# Local development Postgres for the VICI backend.
# Not used in production: the deployed app only depends on DATABASE_URL.
#   docker compose up -d     # start
#   docker compose down      # stop (keeps data)
#   docker compose down -v   # stop + wipe data
services:
  db:
    image: postgres:16-alpine
    container_name: vici-db
    environment:
      POSTGRES_USER: vici
      # Localhost-bound dev container; this value is not a credential.
      POSTGRES_PASSWORD: vici
      POSTGRES_DB: vici
    ports:
      - '5432:5432'
    volumes:
      - vici_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vici -d vici']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  vici_pgdata:
