# VICI backend on Fly.io. See backend/README.md for the deploy + secrets flow.
app = "vici-app-backend"
primary_region = "ams"

[build]

[env]
  PORT = "8787"

# Run DB migrations atomically as part of every deploy: Fly spins a one-off
# machine on the NEW image (with the app's secrets, incl. DATABASE_URL) and
# runs this BEFORE routing traffic to the new version. A failed migration
# aborts the deploy, so code and schema never diverge.
[deploy]
  release_command = "bun run src/db/migrate.ts"

# Two processes: the API (HTTP) and the background worker (the poll loop in
# src/worker.ts, a deliberate no-op until the domain jobs land). The worker has
# no HTTP service and never crash-loops on an empty job list.
[processes]
  api = "bun run src/index.ts"
  worker = "bun run src/worker.ts"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

# Health-check timing sized for a momentary DB hiccup: with the pool's 5s
# connect timeout, /health answers (200 or 503) within ~5s, so an 8s probe
# never mistakes transient slowness for a dead machine. The grace period
# covers the cold boot.
[[http_service.checks]]
  method = "get"
  path = "/health"
  interval = "15s"
  timeout = "8s"
  grace_period = "30s"
