server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # SvelteKit's hashed, content-addressed bundles never change: cache them hard.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell must never be cached: it references hashed bundles, so a
    # stale cached index.html would point at bundles that no longer exist after
    # a deploy and break the load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: any unmatched path serves index.html so client-side routing
    # and deep links / hard reloads resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
