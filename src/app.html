<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Icons. SVG is preferred by modern browsers (sharp at every size);
			 the 32px PNG is a size-targeted fallback for older browsers. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/branding/vici-favicon.svg" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/branding/vici-favicon-32.png"
		/>
		<!-- iOS rejects SVG for the home-screen icon — needs a 180×180 PNG. -->
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/branding/apple-touch-icon.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="application-name" content="VICI" />
		<meta name="apple-mobile-web-app-title" content="VICI" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- Address-bar / status-bar tint. Dark default matches `--ink`; the
			 light-scheme override matches the parchment surface. -->
		<meta name="theme-color" content="#0e0d0b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f2ecdc" media="(prefers-color-scheme: light)" />
		<meta name="color-scheme" content="dark light" />

		<meta
			name="description"
			content="VICI is a consumer-first prediction platform. Forecast outcomes, build a reputation, and earn XP."
		/>
		<link rel="canonical" href="https://vici.app/" />

		<!-- Open Graph / Twitter. The og:image is a 1200×630 raster rendered
			 from the brand SVGs (wordmark on the ink canvas + tagline). Twitter
			 card upgraded to `summary_large_image` to honour it. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="VICI" />
		<meta property="og:url" content="https://vici.app/" />
		<meta property="og:title" content="VICI — Predict at the speed of thought" />
		<meta property="og:description" content="Forecast outcomes, build a reputation, and earn XP." />
		<meta property="og:image" content="https://vici.app/branding/og-image.png" />
		<meta property="og:image:secure_url" content="https://vici.app/branding/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:alt" content="VICI — Predict at the speed of thought." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="VICI — Predict at the speed of thought" />
		<meta
			name="twitter:description"
			content="Forecast outcomes, build a reputation, and earn XP."
		/>
		<meta name="twitter:image" content="https://vici.app/branding/og-image.png" />
		<meta name="twitter:image:alt" content="VICI — Predict at the speed of thought." />

		<!--
			No-flash redirect for signed-in cold loads.
			Reads the `vici.signed-in` localStorage hint written by
			`Authn.svelte` on every auth-state transition. If we're hitting
			the marketing root `/` and the hint says we have a session,
			bounce to `/app` synchronously before SvelteKit hydrates so
			the landing surface never paints. The in-page gate at
			`src/routes/+page.svelte` is the source of truth — this is
			purely a paint-time optimisation, so a stale or missing flag
			just falls through to the regular gate.
		-->
		<script>
			(function () {
				try {
					var signedIn = localStorage.getItem('vici.signed-in') === '1';
					var p = location.pathname;
					if (signedIn && p === '/') {
						location.replace('/app');
					}
				} catch (e) {}
			})();

			// No-FOUC theme bootstrap. Read the saved theme synchronously
			// before the first paint and stamp `data-theme` on <html> so
			// the per-theme tokens in app.css cascade immediately. The
			// theme.store will re-set the same attribute on hydrate; the
			// idempotent write is a no-op. Falls through to the `:root`
			// (dark) defaults when no value is stored or storage is
			// blocked.
			(function () {
				try {
					var t = localStorage.getItem('vici-theme');
					if (t === 'dark' || t === 'light' || t === 'peach') {
						document.documentElement.setAttribute('data-theme', t);
					}
				} catch (e) {}
			})();
		</script>

		%sveltekit.head%

		<title>VICI</title>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>

		<!-- Font preloads -->
		<link
			rel="preload"
			href="/fonts/jetbrainsmono-regular.woff2"
			as="font"
			type="font/woff"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/jetbrainsmono-bold.woff2"
			as="font"
			type="font/woff"
			crossorigin
		/>
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div
				style="
					background: #0e0d0b;
					color: #f2ecdc;
					min-height: 100vh;
					display: flex;
					align-items: center;
					justify-content: center;
					padding: 2rem;
					font-family: 'Hanken Grotesk', system-ui, sans-serif;
					text-align: center;
				"
			>
				<div style="max-width: 28rem">
					<div
						style="
							font-weight: 700;
							letter-spacing: 0.18em;
							font-size: 1.5rem;
							color: #e2b842;
							margin-bottom: 1rem;
						"
					>
						VICI
					</div>
					<p style="line-height: 1.5; margin: 0">
						VICI requires JavaScript to run. Enable JavaScript in your browser and reload the page.
					</p>
				</div>
			</div>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
